name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: campora-jar
          path: target/campora.jar
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: campora-jar

      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: campora.jar
          target: /home/ubuntu/deploy-incoming

      - name: Swap jar, restart, verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            mkdir -p ~/campora/target
            # keep the previous jar for a quick rollback
            if [ -f ~/campora/target/campora.jar ]; then
              cp ~/campora/target/campora.jar ~/campora/target/campora.jar.prev
            fi
            mv ~/deploy-incoming/campora.jar ~/campora/target/campora.jar
            sudo systemctl restart campora
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP; then
                echo "Healthy"; exit 0
              fi
              sleep 3
            done
            echo "App did not become healthy, rolling back"
            sudo journalctl -u campora -n 80 --no-pager
            if [ -f ~/campora/target/campora.jar.prev ]; then
              mv ~/campora/target/campora.jar.prev ~/campora/target/campora.jar
              sudo systemctl restart campora
            fi
            exit 1
