<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-5">
  <div class="auth-wrap text-center">
    <div class="card-c accent">
      <span class="icon-badge mb-3"><i class="bi bi-cone-striped"></i></span>
      <div class="kicker" th:text="${status != null ? status + ' · Detour' : 'Detour'}">Detour</div>
      <h1 class="h3">Something went wrong</h1>
      <p class="text-ink-3">We couldn't complete that. Please try again in a moment.</p>
      <a class="btn btn-route" th:href="@{/}">Go home</a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
