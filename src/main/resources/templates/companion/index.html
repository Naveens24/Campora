<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Companion rides')}"></head>
<body class="role-companion app-page">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container app-main app-narrow">
  <div th:replace="~{fragments/layout :: flash}"></div>

  <!-- ── Hosting ──────────────────────────────────────── -->
  <th:block th:if="${hostedRide != null}">
  <h1 class="app-title">Your ride</h1>
  <section class="card-c">
    <div class="block-head">
      <h2 th:text="'' + ${@fmt.when(hostedRide.departureTime())}">Leaves</h2>
      <span class="pill" th:classappend="${#strings.toLowerCase(hostedRide.status().name())}" th:text="${@fmt.label(hostedRide.status())}">Open</span>
    </div>
    <div th:replace="~{fragments/layout :: routeStack(${hostedRide.pickup()}, ${hostedRide.destination()})}"></div>
    <div class="d-flex align-items-center gap-3 mt-3">
      <div class="seats">
        <span class="seat" th:each="i : ${@fmt.dots(hostedRide.totalSeats(), 12)}" th:classappend="${i <= hostedRide.bookedSeats()} ? 'on'"></span>
      </div>
      <span class="small text-ink-3" th:text="${hostedRide.bookedSeats()} + ' of ' + ${hostedRide.totalSeats()} + ' seats taken'">seats</span>
    </div>
    <p class="hint mt-3 mb-0" th:if="${#lists.isEmpty(hostedRide.members())}">No one has joined yet.</p>
    <ul class="people mt-2" th:unless="${#lists.isEmpty(hostedRide.members())}">
      <li th:each="p : ${hostedRide.members()}">
        <span class="avatar" th:text="${#strings.substring(p.name(), 0, 1)}">A</span>
        <div class="flex-grow-1 min-w-0"><div class="fw-semibold text-body" th:text="${p.name()}">Name</div>
          <div class="small text-ink-3"><span th:text="${p.seats()} + (${p.seats()} == 1 ? ' seat' : ' seats')">1</span> · <span class="mono" th:text="${p.mobile()}">98</span></div></div>
        <a class="btn btn-sm btn-ghost" th:href="'tel:+91' + ${p.mobile()}"><i class="bi bi-telephone me-1"></i>Call</a>
      </li>
    </ul>
    <div class="stack-actions">
      <form th:if="${hostedRide.notStarted() and hostedRide.bookedSeats() > 0}" th:action="@{/companion/rides/{id}/start(id=${hostedRide.id()})}" method="post">
        <button type="submit" class="btn btn-lg btn-route w-100">Start ride</button>
      </form>
      <form th:if="${hostedRide.started()}" th:action="@{/companion/rides/{id}/complete(id=${hostedRide.id()})}" method="post">
        <button type="submit" class="btn btn-lg btn-route w-100">Complete ride</button>
      </form>
      <form th:if="${hostedRide.notStarted()}" th:action="@{/companion/rides/{id}/cancel(id=${hostedRide.id()})}" method="post"
            data-confirm="Cancel this ride? Riders will be notified on their dashboard.">
        <button type="submit" class="btn btn-quiet w-100">Cancel ride</button>
      </form>
    </div>
  </section>
  </th:block>

  <!-- ── Riding ───────────────────────────────────────── -->
  <th:block th:if="${hostedRide == null and joinedRide != null}">
  <h1 class="app-title">You've got a seat</h1>
  <section class="card-c">
    <div class="block-head">
      <h2 th:text="'' + ${@fmt.when(joinedRide.departureTime())}">Leaves</h2>
      <span class="pill" th:classappend="${#strings.toLowerCase(joinedRide.status().name())}" th:text="${@fmt.label(joinedRide.status())}">Open</span>
    </div>
    <div th:replace="~{fragments/layout :: routeStack(${joinedRide.pickup()}, ${joinedRide.destination()})}"></div>
    <ul class="people mt-3">
      <li>
        <span class="avatar" th:text="${#strings.substring(joinedRide.hostName(), 0, 1)}">I</span>
        <div class="flex-grow-1 min-w-0"><div class="fw-semibold text-body" th:text="${joinedRide.hostName()}">Host</div>
          <div class="small text-ink-3"><span class="mono" th:text="${joinedRide.hostMobile()}">98</span><span th:if="${joinedRide.note() != null}" th:text="' · ' + ${joinedRide.note()}"> · note</span></div></div>
        <a class="btn btn-sm btn-route" th:href="'tel:+91' + ${joinedRide.hostMobile()}"><i class="bi bi-telephone me-1"></i>Call</a>
      </li>
    </ul>
    <form class="stack-actions" th:if="${joinedRide.notStarted()}" th:action="@{/companion/rides/{id}/leave(id=${joinedRide.id()})}" method="post"
          data-confirm="Leave this ride?">
      <button type="submit" class="btn btn-quiet w-100">Leave ride</button>
    </form>
  </section>
  </th:block>

  <!-- ── Find or offer ────────────────────────────────── -->
  <th:block th:if="${hostedRide == null and joinedRide == null}">
  <div class="block-head app-title-row">
    <h1 class="app-title">Companion rides</h1>
    <div class="mode-switch" role="tablist" aria-label="Find or offer">
      <button type="button" role="tab" id="tab-find" aria-selected="true" aria-controls="panel-find" data-tab="panel-find">Find</button>
      <button type="button" role="tab" id="tab-offer" aria-selected="false" aria-controls="panel-offer" data-tab="panel-offer" tabindex="-1">Offer</button>
    </div>
  </div>

  <div id="panel-find" role="tabpanel" aria-labelledby="tab-find">
    <section class="card-c empty" th:if="${#lists.isEmpty(rides)}"><i class="bi bi-people"></i>
      <div class="fw-semibold text-body">No rides right now</div>
      <div class="small">Going somewhere? Tap Offer to share your seats.</div></section>
    <article class="ride-card" th:each="r : ${rides}">
      <div class="hs-top">
        <div th:replace="~{fragments/layout :: routeStack(${r.pickup()}, ${r.destination()})}"></div>
        <div class="hs-count"><b th:text="${r.availableSeats()}">2</b><span th:text="${r.availableSeats() == 1} ? 'seat' : 'seats'">seats</span></div>
      </div>
      <div class="hs-meta">
        <span><i class="bi bi-clock"></i><span th:text="${@fmt.when(r.departureTime())}">time</span></span>
        <span><i class="bi bi-person"></i><span th:text="${r.hostName()}">Host</span></span>
        <span class="hs-full" th:if="${r.matchesMyRoute()}">Your route</span>
      </div>
      <p class="hint mb-0 mt-2" th:if="${r.note() != null and !#strings.isEmpty(r.note())}" th:text="${r.note()}">note</p>
      <form class="hs-form" th:action="@{/companion/rides/{id}/join(id=${r.id()})}" method="post">
        <div class="stepper">
          <button type="button" data-step="-1" aria-label="Fewer seats">−</button>
          <input type="number" name="seats" min="1" th:max="${r.availableSeats()}" value="1" aria-label="Seats">
          <button type="button" data-step="1" aria-label="More seats">+</button>
        </div>
        <button type="submit" class="btn btn-route">Join ride</button>
      </form>
    </article>
  </div>

  <div id="panel-offer" role="tabpanel" aria-labelledby="tab-offer" hidden>
    <section class="card-c">
      <form th:action="@{/companion/rides}" th:object="${form}" method="post">
        <div class="od">
          <div class="od-row">
            <i class="pin"></i>
            <label for="pickupId">From</label>
            <select class="form-select" th:field="*{pickupId}" required>
              <option value="">Choose stop</option>
              <th:block th:replace="~{fragments/layout :: stopOptions(${locations})}"></th:block>
            </select>
          </div>
          <div class="od-row">
            <i class="pin end"></i>
            <label for="destinationId">To</label>
            <select class="form-select" th:field="*{destinationId}" required>
              <option value="">Choose stop</option>
              <th:block th:replace="~{fragments/layout :: stopOptions(${locations})}"></th:block>
            </select>
          </div>
          <button type="button" class="od-swap" data-swap="pickupId,destinationId" aria-label="Swap start and destination"><i class="bi bi-arrow-down-up"></i></button>
        </div>
        <label class="form-label" for="departureTime">Leaving at</label>
        <input class="form-control mb-3" id="departureTime" name="departureTime" type="datetime-local"
               th:value="${@fmt.inputIn(30)}" required>
        <label class="form-label" for="note">Note <span class="text-ink-3 fw-normal">(optional)</span></label>
        <input class="form-control mb-3" th:field="*{note}" maxlength="200" placeholder="e.g. Meet at the library steps">
        <div class="go-row">
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Fewer seats">−</button>
            <input th:field="*{totalSeats}" type="number" min="1" th:max="${maxSeats}" required aria-label="Seats to share">
            <button type="button" data-step="1" aria-label="More seats">+</button>
            <span>seats</span>
          </div>
          <button type="submit" class="btn btn-lg btn-route">Offer ride</button>
        </div>
      </form>
    </section>
  </div>
  </th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
