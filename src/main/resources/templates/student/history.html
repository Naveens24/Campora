<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('History')}"></head>
<body class="role-student app-page">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container app-main app-narrow">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="block-head app-title-row">
    <h1 class="app-title">History</h1>
    <div class="mode-switch" role="tablist" aria-label="History">
      <button type="button" role="tab" id="tab-rides" aria-selected="true" aria-controls="panel-rides" data-tab="panel-rides">Rides</button>
      <button type="button" role="tab" id="tab-requests" aria-selected="false" aria-controls="panel-requests" data-tab="panel-requests" tabindex="-1">Requests</button>
    </div>
  </div>

  <section class="card-c list-card" id="panel-rides" role="tabpanel" aria-labelledby="tab-rides">
    <div class="empty" th:if="${#lists.isEmpty(journeys)}"><i class="bi bi-signpost"></i>No rides yet.</div>
    <ul class="people" th:unless="${#lists.isEmpty(journeys)}">
      <li th:each="j : ${journeys}">
        <div class="flex-grow-1 min-w-0">
          <div class="fw-semibold text-body" th:text="${j.pickup()} + ' → ' + ${j.destination()}">route</div>
          <div class="small text-ink-3"><span th:text="${@fmt.when(j.when())}">time</span> · <span th:text="${j.counterpart()}">driver</span> · <span th:text="${#strings.capitalize(#strings.toLowerCase(j.kind()))}">Auto</span></div>
        </div>
        <span class="pill" th:classappend="${#strings.toLowerCase(j.status())}" th:text="${#strings.capitalize(#strings.replace(#strings.toLowerCase(j.status()), '_', ' '))}">Done</span>
      </li>
    </ul>
  </section>

  <section class="card-c list-card mt-0" id="panel-requests" role="tabpanel" aria-labelledby="tab-requests" hidden>
    <div class="empty" th:if="${#lists.isEmpty(requests)}"><i class="bi bi-list-task"></i>No requests yet.</div>
    <ul class="people" th:unless="${#lists.isEmpty(requests)}">
      <li th:each="r : ${requests}">
        <div class="flex-grow-1 min-w-0">
          <div class="fw-semibold text-body" th:text="${r.pickup()} + ' → ' + ${r.destination()}">route</div>
          <div class="small text-ink-3"><span th:text="${@fmt.when(r.createdAt())}">time</span> · <span th:text="${r.type().label}">Any</span> · <span th:text="${r.seats()} + (${r.seats()} == 1 ? ' seat' : ' seats')">1 seat</span></div>
        </div>
        <span class="pill" th:classappend="${#strings.toLowerCase(r.status().name())}" th:text="${@fmt.label(r.status())}">Open</span>
      </li>
    </ul>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
