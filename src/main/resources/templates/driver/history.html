<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trips')}"></head>
<body class="role-driver app-page">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container app-main app-narrow">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1 class="app-title">Your trips</h1>
  <section class="card-c list-card">
    <div class="empty" th:if="${#lists.isEmpty(trips)}"><i class="bi bi-truck-front"></i>
      <div class="fw-semibold text-body">No trips yet</div>
      <div class="small">Accept a route to start your first one.</div></div>
    <ul class="people" th:unless="${#lists.isEmpty(trips)}">
      <li th:each="t : ${trips}">
        <div class="flex-grow-1 min-w-0">
          <div class="fw-semibold text-body" th:text="${t.pickup()} + ' → ' + ${t.destination()}">route</div>
          <div class="small text-ink-3"><span th:text="${@fmt.when(t.createdAt())}">time</span> · <span th:text="${t.seats()} + (${t.seats()} == 1 ? ' seat' : ' seats')">5 seats</span><span
            th:if="${t.startTime() != null and t.endTime() != null}" th:text="' · ' + ${@fmt.time(t.startTime())} + ' to ' + ${@fmt.time(t.endTime())}"> · times</span></div>
        </div>
        <span class="pill" th:classappend="${#strings.toLowerCase(t.status().name())}" th:text="${@fmt.label(t.status())}">Done</span>
      </li>
    </ul>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
