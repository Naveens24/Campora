<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
  <div class="auth-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card-c accent">
      <h1 class="h4 mb-2">Set a new password</h1>
      <p class="text-ink-3 mb-4">Use the code sent to <span class="text-body" th:text="${email}">you@example.com</span>. Check spam too.</p>
      <form th:action="@{/reset}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger flash" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div><div th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</div></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="code">6-digit code</label>
          <input class="form-control otp-input" th:field="*{code}" th:errorclass="is-invalid" inputmode="numeric"
                 maxlength="6" autocomplete="one-time-code" placeholder="••••••" required autofocus>
          <div class="invalid-feedback" th:errors="*{code}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <input class="form-control" id="password" name="password" th:errorclass="is-invalid" th:field="*{password}"
                 type="password" autocomplete="new-password" required>
          <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <input class="form-control" th:field="*{confirmPassword}"
                 th:classappend="${#fields.hasErrors('passwordConfirmed') or #fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                 type="password" autocomplete="new-password" required>
          <div class="invalid-feedback" th:errors="*{passwordConfirmed}"></div>
          <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-route w-100 py-2">Change password</button>
      </form>
      <p class="text-center text-ink-3 mt-4 mb-0"><a th:href="@{/forgot}">Send a new code</a></p>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
