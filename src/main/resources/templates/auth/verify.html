<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verify email')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
  <div class="auth-wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card-c accent">
      <div class="kicker">Step 2 of 3 · Verification</div>
      <h1 class="h4 mb-2">Enter the 6-digit code</h1>
      <p class="text-ink-3 mb-4" th:if="${email != null and mailEnabled}">Sent to <span class="text-body" th:text="${email}">you@example.com</span>. Check spam too.</p>
      <p class="text-ink-3 mb-4" th:if="${email == null}">Add your email below and we'll send you a code.</p>

      <form th:action="@{/verify}" method="post" novalidate>
        <label class="form-label visually-hidden" for="code">Verification code</label>
        <input class="form-control otp-input mb-4" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" autocomplete="one-time-code" placeholder="••••••" required autofocus>
        <button type="submit" class="btn btn-route w-100 py-2"><i class="bi bi-shield-check me-1"></i>Verify</button>
      </form>
      <form th:action="@{/verify/resend}" method="post" class="text-center mt-3">
        <button type="submit" class="btn btn-link text-decoration-none">Resend code</button>
      </form>
      <form th:action="@{/verify/email}" method="post" class="mt-3 pt-3 border-top">
        <label class="form-label" for="email" th:text="${email == null} ? 'Your email' : 'Wrong address? Change it'">Email</label>
        <div class="d-flex gap-2">
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
          <button type="submit" class="btn btn-ghost text-nowrap">Send code</button>
        </div>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
