<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560">
  <style>
    .spin { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob 1.6s ease-in-out infinite; }
    .b2 { animation-delay: -.5s; } .b3 { animation-delay: -1s; }
    .road { animation: road 1.4s linear infinite; }
    .cloud { animation: cloud 22s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 50% { transform: translateY(-2.5px); } }
    @keyframes road { to { transform: translateX(-88px); } }
    @keyframes cloud { to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE9E4"/><stop offset=".62" stop-color="#F3F6E6"/><stop offset="1" stop-color="#FFEFC6"/></linearGradient>
    <linearGradient id="tar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A5362"/><stop offset="1" stop-color="#2C333F"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12A572"/><stop offset="1" stop-color="#08734F"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD869"/><stop offset="1" stop-color="#FBB91F"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DFE5EA"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9F0F4"/><stop offset="1" stop-color="#8FBCC8"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C6FF0"/><stop offset="1" stop-color="#2546C4"/></linearGradient>
    <clipPath id="stage"><path d="M300 24H716a28 28 0 0 1 28 28V508a28 28 0 0 1-28 28H300A256 256 0 0 1 300 24Z"/></clipPath>
    <g id="tyre">
      <circle r="27" fill="#171C24"/><circle r="17" fill="#D5DAE0"/><circle r="12" fill="#8B95A3"/>
      <g stroke="#E9ECEF" stroke-width="3"><path d="M0-12V12M-12 0H12M-8.5-8.5 8.5 8.5M-8.5 8.5 8.5-8.5"/></g><circle r="4.5" fill="#E9ECEF"/>
    </g>
    <g id="tree"><rect x="-5" y="-34" width="10" height="36" rx="4" fill="#8A6A4A"/><circle cx="0" cy="-58" r="32" fill="#4FA67C"/><circle cx="-20" cy="-42" r="22" fill="#3F9470"/><circle cx="21" cy="-44" r="21" fill="#62B68C"/></g>
  </defs>

